name: Android CI - Build APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peleza-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify repository structure
        run: python3 scripts/verify-project.py

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug
          rc=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "----- Android lint report -----"
            cat "$REPORT"
          fi
          exit $rc

      - name: Build debug APK and release AAB
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug :app:bundleRelease

      - name: Package build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Peleza-Stream-v1.1.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Peleza-Stream-v1.1.0-release-unsigned.aab
          if [ -f app/build/reports/lint-results-debug.html ]; then cp app/build/reports/lint-results-debug.html dist/; fi
          if [ -f app/build/reports/lint-results-debug.txt ]; then cp app/build/reports/lint-results-debug.txt dist/; fi
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: Peleza-Stream-Android-v1.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Peleza Stream Android 1.1.0"
            echo ""
            echo "- Package: `com.pelezastream.app`"
            echo "- Debug APK: `Peleza-Stream-v1.1.0-debug.apk`"
            echo "- Release bundle: `Peleza-Stream-v1.1.0-release-unsigned.aab`"
            echo "- Target SDK: Android 16 / API 36"
            echo "- Production Play signing/deployment: use the **Google Play Release** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
