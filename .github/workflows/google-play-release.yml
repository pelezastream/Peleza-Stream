name: Google Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

concurrency:
  group: peleza-google-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify required release secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify repository structure
        run: python3 scripts/verify-project.py

      - name: Decode and validate Android upload keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
          mkdir -p "$RUNNER_TEMP/peleza-signing"
          export PELEZA_KEYSTORE_OUT="$RUNNER_TEMP/peleza-signing/peleza-upload.jks"
          python3 - <<'PY'
          import base64, binascii, os, pathlib, re
          raw = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          out = pathlib.Path(os.environ["PELEZA_KEYSTORE_OUT"])
          compact = re.sub(r"\s+", "", raw).strip("'\"")
          decoded = None
          try:
              decoded = base64.b64decode(compact, validate=True)
          except (binascii.Error, ValueError):
              pass
          if not decoded:
              parts = []
              for line in raw.splitlines():
                  line = line.strip().strip("'\"")
                  if len(line) >= 60 and re.fullmatch(r"[A-Za-z0-9+/=]+", line):
                      parts.append(line)
              if parts:
                  try:
                      decoded = base64.b64decode("".join(parts), validate=True)
                  except (binascii.Error, ValueError):
                      decoded = None
          if not decoded or len(decoded) < 512:
              raise SystemExit("Could not decode ANDROID_KEYSTORE_BASE64.")
          out.write_bytes(decoded)
          PY
          chmod 600 "$PELEZA_KEYSTORE_OUT"
          keytool -list -keystore "$PELEZA_KEYSTORE_OUT" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$PELEZA_KEYSTORE_OUT" >> "$GITHUB_ENV"
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'ANDROID_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run release lint
        run: gradle --no-daemon --stacktrace :app:lintRelease

      - name: Build signed release APK and AAB
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease :app:bundleRelease

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          apksigner verify --verbose "$APK" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "Signed APK verified: $APK"
          echo "Signed AAB verified: $AAB"

      - name: Prepare permanent signed release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Peleza-Stream-v1.1.0.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Peleza-Stream-v1.1.0.aab
          (cd dist && sha256sum Peleza-Stream-v1.1.0.apk Peleza-Stream-v1.1.0.aab > SHA256SUMS.txt)

      - name: Save signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Peleza-Stream-v1.1.0-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent GitHub Android release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Peleza-Stream-v1.1.0.apk dist/Peleza-Stream-v1.1.0.aab dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/Peleza-Stream-v1.1.0.apk dist/Peleza-Stream-v1.1.0.aab dist/SHA256SUMS.txt --title "Peleza Stream Android v1.1.0" --notes "Signed Peleza Stream Android production release."
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pelezastream.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Peleza Stream Google Play release"
            echo ""
            echo "- Package: `com.pelezastream.app`"
            echo "- Version: 1.1.0 (110)"
            echo "- Requested track: `${{ inputs.track }}`"
          } >> "$GITHUB_STEP_SUMMARY"
