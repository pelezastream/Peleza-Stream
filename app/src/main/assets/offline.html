<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Peleza Stream</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:28px}.card{max-width:520px;text-align:center;background:#141417;border:1px solid #2b2b31;border-radius:24px;padding:36px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.mark{width:72px;height:72px;border-radius:50%;background:#e50914;display:grid;place-items:center;margin:0 auto 22px}.play{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:23px solid #fff;margin-left:5px}h1{font-size:24px;margin:0 0 10px}p{color:#b9b9c0;line-height:1.55;margin:0 0 24px}button{border:0;border-radius:999px;background:#e50914;color:white;font-weight:700;font-size:16px;padding:13px 24px;cursor:pointer}.small{font-size:12px;color:#7c7c84;margin-top:18px}</style>
</head>
<body>
  <main class="card">
    <div class="mark"><span class="play"></span></div>
    <h1>Peleza Stream is taking longer than expected</h1>
    <p>Check your internet connection and try again. If the website is temporarily busy, the app will reconnect when the service responds.</p>
    <button onclick="location.href='https://www.pelezastream.com/'">Try again</button>
    <div class="small">Peleza Stream Android</div>
  </main>
</body>
</html>
